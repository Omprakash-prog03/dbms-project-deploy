{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
{% elif name == 'people' %}<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/>
{% elif name == 'person' %}<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a5 5 0 0 1 5-5h6a5 5 0 0 1 5 5v2"/>
{% elif name == 'book' %}<path d="M12 5v16M12 5C9 2 5 2 2 3v16c4-1 7 0 10 2 3-2 6-3 10-2V3c-3-1-7-1-10 2Z"/>
{% elif name == 'building' %}<path d="m3 9 9-6 9 6M4 9h16M3 21h18M5 12v6m7-6v6m7-6v6"/>
{% elif name == 'calendar' %}<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18m-13 4h2m4 0h2"/>
{% elif name == 'check-square' %}<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'chart' %}<path d="M4 3v18h17M8 16v-4m5 4V8m5 8V5"/>
{% elif name == 'wallet' %}<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 9h18m-4 5h4M7 5V3h10v2"/>
{% elif name == 'sparkles' %}<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Zm7-1v4m-2-2h4"/>
{% elif name == 'database' %}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/>
{% elif name == 'search' %}<circle cx="10.8" cy="10.8" r="7.3"/><path d="m16 16 5 5"/>
{% elif name == 'bell' %}<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9m4.3 12a2 2 0 0 0 3.4 0"/>
{% elif name == 'arrow-up-right' %}<path d="M6 18 18 6M6 6h12v12"/>
{% elif name == 'arrow-right' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
{% elif name == 'chevron-down' %}<path d="m6 9 6 6 6-6"/>
{% elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'menu' %}<path d="M4 8h16M4 16h16"/>
{% elif name == 'logout' %}<path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4m7-14 5 5-5 5M9 12h12"/>
{% elif name == 'download' %}<path d="M12 3v12m-5-5 5 5 5-5M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/>
{% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
{% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name == 'shield' %}<path d="m12 2 8 4v6c0 5-8 10-8 10S4 17 4 12V6l8-4Z"/><path d="m8 12 3 3 5-6"/>
{% elif name == 'key' %}<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 7.2-7.2M16 6l2 2m-4 2 2 2"/>
{% elif name == 'lock' %}<rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>
{% elif name == 'eye' %}<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% else %}<circle cx="12" cy="12" r="8"/>{% endif %}
</svg>
{%- endmacro %}
{% macro brand() -%}<svg class="brand-symbol" width="32" height="36" viewBox="0 0 40 44" fill="none" aria-hidden="true"><path d="M20 2 36 8v14c0 9-7 15-16 20C11 37 4 31 4 22V8L20 2Z" fill="currentColor" fill-opacity=".07" stroke="currentColor" stroke-width="1.4"/><path d="M13 13v16m14-16v16M13 21h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="m20 5 1 2-1 2-1-2 1-2Z" fill="currentColor"/></svg><span class="brand-wordmark"><span class="brand-name">{{ portal_short_name }}</span><span class="brand-descriptor">{{ portal_descriptor }}</span></span>{%- endmacro %}
