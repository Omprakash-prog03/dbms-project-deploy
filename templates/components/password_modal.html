<!-- Administrative Password Reset Modal -->
<div id="passwordResetModal" class="sql-modal-backdrop" style="display: none; align-items: center; justify-content: center;">
  <div class="sql-modal-content" style="max-width: 440px; width: 100%;">
    <div class="sql-modal-header">
      <div>
        <h3 style="font-size: 16px; font-weight: 500;">Reset Portal Password</h3>
        <p id="resetTargetDisplay" style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Setting credentials</p>
      </div>
      <button class="sql-close-btn" onclick="closePasswordResetModal()">&times;</button>
    </div>

    <form id="passwordResetForm" onsubmit="handlePasswordResetSubmit(event)" style="padding: 22px;">
      <input type="hidden" id="resetUserType" value="">
      <input type="hidden" id="resetTargetId" value="">

      <div class="form-group" style="margin-bottom: 16px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">New Password (Min 8 characters) *</label>
        <input type="password" id="resetNewPassword" required minlength="8" class="pill-select" style="width: 100%; border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 12px;" placeholder="Enter new password">
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label style="font-size: 12px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px;">Confirm Password *</label>
        <input type="password" id="resetConfirmPassword" required minlength="8" class="pill-select" style="width: 100%; border: 1px solid var(--border-light); border-radius: 8px; padding: 8px 12px;" placeholder="Re-type new password">
      </div>

      <div style="background: var(--surface-raised); padding: 10px 14px; border-radius: 8px; font-size: 11.5px; color: var(--text-muted); margin-bottom: 20px;">
        <strong>Security:</strong> Updates <code>app_user.password_hash</code> with salt-hashed bcrypt directly inside the database.
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button type="button" class="pill-btn" onclick="closePasswordResetModal()">Cancel</button>
        <button type="submit" class="action-pill-btn" style="padding: 8px 20px;">Update Password</button>
      </div>
    </form>
  </div>
</div>

<script>
function openPasswordResetModal(userType, targetId, displayName) {
  document.getElementById('passwordResetForm').reset();
  document.getElementById('resetUserType').value = userType;
  document.getElementById('resetTargetId').value = targetId;
  document.getElementById('resetTargetDisplay').innerText = `Target: ${displayName} (${userType.toUpperCase()})`;
  openModal('passwordResetModal');
}

function closePasswordResetModal() {
  closeModal('passwordResetModal');
}

async function handlePasswordResetSubmit(e) {
  e.preventDefault();
  const p1 = document.getElementById('resetNewPassword').value;
  const p2 = document.getElementById('resetConfirmPassword').value;
  if (p1 !== p2) {
    showToast('Passwords do not match!', 'error');
    return;
  }

  const payload = {
    user_type: document.getElementById('resetUserType').value,
    target_id: document.getElementById('resetTargetId').value,
    new_password: p1
  };

  try {
    const res = await fetch('/api/users/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok && data.success) {
      showToast(data.message);
      closePasswordResetModal();
    } else {
      showToast(data.message || 'Password update failed', 'error');
    }
  } catch (err) {
    showToast('Failed to connect: ' + err.message, 'error');
  }
}
</script>
